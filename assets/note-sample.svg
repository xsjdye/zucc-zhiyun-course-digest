<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="620" height="600" fill="#ffffff"/>
  <text x="16" y="22" font-size="14" font-weight="700" fill="#1f2328">整理成品长这样（六块结构，每句依据都能回平台核对）</text>

  <!-- 笔记卡片 -->
  <rect x="16" y="34" width="588" height="424" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="30" y="58" font-size="13" font-weight="700" fill="#1f2328">数字媒体传播 · 第 3 讲 媒介环境学</text>

  <rect x="30" y="68" width="560" height="34" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="40" y="85" font-size="9.5" font-weight="700" fill="#0a3069">【课】= 老师讲的，可回平台核对　｜　【延】= 视角补的，不作为重点依据</text>
  <text x="40" y="97" font-size="9" fill="#0a3069">persona: 传播学研究者（按课程名自动推断）　定位按段给（一段 ≈ 40 分钟）</text>

  <text x="30" y="122" font-size="10.5" font-weight="700" fill="#1f2328">## 骨架</text>
  <text x="40" y="137" font-size="9" fill="#57606a">"媒介即环境"（核心命题）</text>
  <text x="40" y="149" font-size="9" fill="#57606a">├─ 由此推出 → 媒介有"偏向" → 塑造社会形态</text>
  <text x="40" y="161" font-size="9" fill="#57606a">└─ 划界 → 媒介效果研究（那条线看"内容"）</text>

  <text x="30" y="188" font-size="10.5" font-weight="700" fill="#1f2328">## 第 1 段（00:00–26:00）</text>
  <text x="40" y="205" font-size="10" font-weight="700" fill="#1f2328">### 一、核心命题：媒介即环境</text>
  <text x="40" y="221" font-size="9.5" fill="#1f2328"><tspan font-weight="700" fill="#0a3069">【课】</tspan> "媒介即环境"是本讲核心命题，老师围绕它举了三个例子展开。</text>
  <text x="40" y="235" font-size="9.5" fill="#1f2328">媒介不是中性信息管道，它本身就是一种环境，会改变人的感知比例。</text>
  <text x="40" y="253" font-size="9.5" fill="#7d4e00"><tspan font-weight="700">【延】</tspan> 这个判断的真正用途是让你主动选介质，而不是默认用能用的那个。</text>
  <text x="40" y="267" font-size="9.5" fill="#7d4e00">选择不是"内容"的事，是"环境决定读者怎么读"的事。</text>
  <text x="40" y="285" font-size="9" fill="#8c959f">&gt; 回听：09:54–12:24</text>

  <text x="30" y="308" font-size="10.5" font-weight="700" fill="#1f2328">## 重点（只列有依据的）</text>
  <text x="40" y="324" font-size="9.5" fill="#1f2328">★ "媒介即环境"——口述反复展开且老师明说是核心命题　<tspan font-weight="700" fill="#0a3069">【课】</tspan></text>

  <text x="30" y="347" font-size="10.5" font-weight="700" fill="#1f2328">## 遗漏</text>
  <text x="40" y="362" font-size="9.5" fill="#1f2328">· 12:00–13:30 无课件帧（老师切白板），仅有口述，未纳入正文</text>

  <text x="30" y="385" font-size="10.5" font-weight="700" fill="#1f2328">## 转写勘误</text>
  <rect x="30" y="391" width="560" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="405" font-size="9" fill="#57606a">转写原文　　　应为　　　依据</text>
  <line x1="40" y1="409" x2="580" y2="409" stroke="#d0d7de"/>
  <text x="40" y="421" font-size="9" fill="#1f2328">媒介偏想　　　<tspan font-weight="700">媒介偏向</tspan>　　课件文字</text>
  <text x="40" y="432" font-size="9" fill="#82071e">伊尼斯　　　　待核　　　无课件佐证，需回听录音</text>

  <!-- 图例 -->
  <g font-size="9.5">
    <rect x="16" y="470" width="290" height="50" rx="4" fill="#fff8c5" stroke="#bf8700"/>
    <text x="26" y="486" font-size="10" font-weight="700" fill="#7d4e00">骨架先给，再落细节</text>
    <text x="26" y="500" fill="#7d4e00">一张图看懂这节课解决什么问题，</text>
    <text x="26" y="510" fill="#7d4e00">不让人一开始就掉进知识点的堆里</text>

    <rect x="314" y="470" width="290" height="50" rx="4" fill="#ffebe9" stroke="#cf222e"/>
    <text x="324" y="486" font-size="10" font-weight="700" fill="#82071e">【课】/【延】必须分开</text>
    <text x="324" y="500" fill="#82071e">合并后读者分不出哪句能核对、</text>
    <text x="324" y="510" fill="#82071e">哪句是 AI 补的，"依据"就废了</text>

    <rect x="16" y="526" width="290" height="50" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="26" y="536" font-size="10" font-weight="700" fill="#0a3069">时间粒度按段，不按秒</text>
    <text x="26" y="550" fill="#0a3069">正文只写「第 N 段（HH:MM–HH:MM）」；</text>
    <text x="26" y="560" fill="#0a3069">秒级指针收在段末的 &gt; 回听 一行</text>

    <rect x="314" y="526" width="290" height="50" rx="4" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="324" y="536" font-size="10" font-weight="700" fill="#1f2328">密度来自判断，不是条数</text>
    <text x="324" y="550" fill="#57606a">【延】指出课上没说的难点与真正</text>
    <text x="324" y="560" fill="#57606a">用法，而不是复述老师</text>
  </g>

  <text x="16" y="592" font-size="9" fill="#8c959f">示例内容为虚构，仅演示格式。真实课堂笔记含他人姓名与可定位信息，不得公开分发。</text>
</svg>
